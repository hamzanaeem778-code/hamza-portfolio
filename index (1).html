/* Signature idea: a white gallery wall. The page has no colour of its own, so every bit of colour on screen
   comes from the shots themselves, each playing in its own small frame. The only accent is the button rim,
   built from the four projects' accents (Forma saffron, Larder beetroot, Solstead lime, Offing teal).
   Layout: name and intro centred at the top, then the shots as small cards, three to a row; any card opens
   a larger view (Forma opens its real, live build). A centred contact block closes the page.
   Fonts: Mona Sans for the name and headings, Instrument Sans for body. Motion: smooth ease-out, no bounce. */
:root{
  --bg:#ffffff;
  --ink:#0d0d0e;
  --ink-2:rgba(13,13,14,.58);
  --ink-3:rgba(13,13,14,.38);
  --line:rgba(13,13,14,.08);
  --tile:#f4f4f2;
  --forma:#ffc83d; --solstead:#9fd23f; --larder:#f06b93; --offing:#10a593;
  --display:"Mona Sans","Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans","Mona Sans",ui-sans-serif,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --max:1240px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.wrap{padding-left:max(clamp(20px,4vw,44px),env(safe-area-inset-left,0px));padding-right:max(clamp(20px,4vw,44px),env(safe-area-inset-right,0px))}}
.ph{border-bottom:1px dashed var(--ink-3)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

/* avatar placeholder: swap the initials for <img> once Hamza sends a photo */
.avatar{display:grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;font:500 22px/1 var(--display);letter-spacing:-.03em;color:rgba(13,13,14,.42);
  background:radial-gradient(110% 110% at 30% 20%,#ffffff,#e9e8e4 70%);box-shadow:inset 0 0 0 1px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* intro, centred */
.intro{text-align:center;padding-block:clamp(72px,11vw,140px) clamp(48px,6vw,80px)}
.intro .avatar{width:76px;height:76px;margin:0 auto 26px}
.role{font-size:14.5px;color:var(--ink-2);margin:0 0 12px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,5.4vw,72px);line-height:1;letter-spacing:-.045em}
h1 .line{display:block;overflow:hidden;padding:.06em 0 .12em;margin:-.06em 0 -.12em}
h1 .line>span{display:block;animation:rise 1s cubic-bezier(.2,.75,.15,1) both}
@keyframes rise{from{transform:translateY(calc(100% + .45em))}to{transform:none}}
.lede{margin:22px auto 0;max-width:470px;font-size:16.5px;line-height:1.55;color:var(--ink-2);animation:blurrise .9s .15s var(--ease) both}
.intro .btn{margin-top:26px;animation:blurrise .9s .24s var(--ease) both}
@keyframes blurrise{from{opacity:.001;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}

/* button: dark satin pill; its rim is the four project accents, brightest along the bottom edge */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 18px;border:0;border-radius:999px;cursor:pointer;
  font:500 14px/1 var(--body);letter-spacing:-.01em;color:#f6f5f2;text-decoration:none;background:transparent;transition:transform .18s var(--ease),filter .18s var(--ease)}
.btn::before{content:"";position:absolute;inset:-1px -1px -1.5px;border-radius:inherit;z-index:-2;
  background:linear-gradient(90deg,var(--forma),var(--larder) 36%,var(--solstead) 66%,var(--offing));
  box-shadow:0 8px 18px -12px rgba(240,107,147,.6);transition:box-shadow .25s var(--ease)}
.btn::after{content:"";position:absolute;inset:0 0 .5px;border-radius:inherit;z-index:-1;
  background:linear-gradient(180deg,#2c2c2e,#121213);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.4)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:hover::before{box-shadow:0 10px 24px -10px rgba(240,107,147,.6),0 8px 22px -12px rgba(16,165,147,.6)}
.btn:active{transform:translateY(1px)}

/* shots: small cards, three to a row */
.shots .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 16px}
.card{display:block;text-decoration:none;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit;width:100%}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--tile);max-width:100%}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease)}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line);pointer-events:none}
.card:hover .thumb video{transform:scale(1.025)}
.label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px}
.label b{font-weight:500;letter-spacing:-.01em}
.label span{color:var(--ink-2)}
.label em{font-style:normal;color:var(--ink-3);white-space:nowrap;font-size:13.5px}
.label .t{min-width:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.use{margin:6px 0 0;max-width:42ch;font-size:14px;line-height:1.5;color:var(--ink-2)}
@media (max-width:980px){.shots .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.shots .grid{grid-template-columns:1fr;gap:28px}}

/* larger view */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0;color:var(--ink)}
dialog::backdrop{background:rgba(250,250,249,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.view{height:100%;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.view-inner{width:min(1240px,100%,calc((100vh - 150px) * 16 / 9))}
.stage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--tile);box-shadow:0 40px 80px -40px rgba(13,13,14,.35),inset 0 0 0 1px var(--line)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage iframe{position:absolute;left:0;top:0;width:1600px;height:900px;border:0;transform-origin:0 0}
.view-cap{display:flex;justify-content:space-between;align-items:center;gap:16px 32px;margin-top:16px;flex-wrap:wrap}
.view-cap .t{font-size:14.5px}
.view-cap .t b{font-weight:500}
.view-cap p{margin:4px 0 0;max-width:560px;color:var(--ink-2);font-size:14.5px}
.view-act{display:flex;gap:18px;align-items:center;font-size:14px}
.view-act a,.view-act button{color:var(--ink-2);text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer;transition:color .2s var(--ease)}
.view-act a:hover,.view-act button:hover{color:var(--ink)}
.view-act a::after{content:" \2197"}

/* contact, centred */
.contact{text-align:center;padding-block:clamp(110px,13vw,170px) clamp(110px,13vw,170px);overflow:hidden}
h2{font-size:clamp(28px,3.2vw,44px);line-height:1.04;letter-spacing:-.04em}
h2 .dim{color:var(--ink-3)}
.actions{position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:30px}
.btn.ghost{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px rgba(13,13,14,.14),0 1px 2px rgba(13,13,14,.05)}
.btn.ghost::before,.btn.ghost::after{content:none}
.btn.ghost:hover{filter:none;box-shadow:inset 0 0 0 1px rgba(13,13,14,.26),0 2px 6px -2px rgba(13,13,14,.12)}
.copied{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;font-size:13.5px;color:var(--ink-3);opacity:0;transition:opacity .3s var(--ease)}
.copied.on{opacity:1}
.elsewhere{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin-top:40px;font-size:14px;color:var(--ink-2)}
.elsewhere a{text-decoration:none}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(90px,10vw,130px);padding-block:20px;font-size:13.5px;color:var(--ink-3)}
.word{font:500 clamp(64px,15vw,224px)/.8 var(--display);letter-spacing:-.065em;text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,rgba(13,13,14,.09),rgba(13,13,14,0) 82%);-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  h1 .line>span,.lede,.intro .btn{animation:none}
  .thumb video{transition:none}
}
</style>

   d:'Forma turns a sentence into a 3D model, so the hero builds one from 64,000 particles. Move your cursor through it.'},
  {name:'Solstead',kind:'Solar home dashboard',date:'Oct 2026',v:'solstead',use:'Gives homeowners one calm view of what their panels, battery and grid are doing right now.',live:'solstead-dashboard.html',
   d:'One day plays out across the dashboard: a now line walks the solar curve and every panel catches up in turn.'},
  {name:'Offing',kind:'CRM hero',date:'Oct 2026',v:'offing-hero',use:'Opens a CRM site by showing the pipeline it keeps up to date, so visitors get the product at a glance.',live:'offing-hero.html',
   d:'A halftone sea rolls in, and each swell lands a new deal in the pipeline window.'},
  {name:'Larder',kind:'Feature bento',date:'Oct 2026',v:'larder',use:'Explains three core features side by side, each with its own small product demo.',live:'larder-features.html',
   d:'Three boxes for a restaurant kitchen: stock that counts itself, orders sent at close and plates re-costed live.'},
  {name:'Offing',kind:'Feature bento',date:'Oct 2026',v:'offing-bento',use:'Shows sales teams three ways the product takes updating off their hands, in its real UI.',live:'offing-hero.html',
   d:'The same coast carried into three product moments: a deal found in the inbox, a meeting logged and a forecast.'},
  {name:'Offing',kind:'Deal journey',date:'Oct 2026',v:'offing-journey',use:'Walks a buyer through how one deal moves from first email to signed, step by step.',live:'offing-hero.html',
   d:'A step-by-step story of one deal moving from discovery to committed.'},
];
const grid=$('#grid');
SHOTS.forEach((s,i)=>{
  const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label',`Open ${s.name}, ${s.kind}`);
  b.innerHTML=`<div class="thumb"><video muted loop playsinline preload="none" poster="media/${s.poster||s.v}.jpg" src="media/${s.v}.mp4"></video></div>
    <div class="label"><span class="t"><b>${s.name}</b><span>${s.kind}</span></span><em>${s.date}</em></div>`;
  b.addEventListener('click',()=>open(i));grid.appendChild(b);
});

/* small videos play only while on screen */
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting&&!RM&&!dlg.open){v.preload='auto';v.play().catch(()=>{})}else v.pause()}),{threshold:.3});
document.querySelectorAll('.thumb video').forEach(v=>io.observe(v));

/* larger view: a bigger video, or Forma's real build running live */
const dlg=$('#viewer'),stage=$('#stage');let fitter=null;
function open(i){
  const s=SHOTS[i];stage.innerHTML='';
  if(s.iframe&&!RM){
    const f=document.createElement('iframe');f.src='live/'+s.live;f.title=s.name+' live';stage.appendChild(f);
    const fit=()=>{f.style.transform=`scale(${stage.clientWidth/1600})`};fitter=new ResizeObserver(fit);fitter.observe(stage);fit();
  }else{
    const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.poster=`media/${s.poster||s.v}.jpg`;v.src=`media/${s.v}.mp4`;
    if(RM)v.controls=true;else v.autoplay=true;stage.appendChild(v);
  }
  $('#vt').innerHTML=`<b>${s.name}</b> · ${s.kind}`;
  document.querySelectorAll('.thumb video').forEach(v=>v.pause());
  dlg.showModal();
}
const close=()=>dlg.close();
$('#vclose').addEventListener('click',close);
$('#view').addEventListener('click',e=>{if(e.target.id==='view')close()});
dlg.addEventListener('close',()=>{stage.innerHTML='';if(fitter){fitter.disconnect();fitter=null}
  document.querySelectorAll('.thumb video').forEach(v=>{const r=v.getBoundingClientRect();if(!RM&&r.bottom>0&&r.top<innerHeight)v.play().catch(()=>{})})});

/* copy email */
const copied=$('#copied'),mail='hamzanaeem778@gmail.com';
$('#copy').addEventListener('click',()=>{
  const done=t=>{copied.textContent=t;copied.classList.add('on');setTimeout(()=>copied.classList.remove('on'),1800)};
  const sel=()=>done(mail);
  try{navigator.clipboard.writeText(mail).then(()=>done('Copied'),sel)}catch(e){sel()}
});
})();
